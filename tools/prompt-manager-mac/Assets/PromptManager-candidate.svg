<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="236" y1="132" x2="790" y2="890" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D8D0FF"/>
      <stop offset="0.52" stop-color="#9184FF"/>
      <stop offset="1" stop-color="#6B5AF1"/>
    </linearGradient>
    <radialGradient id="softLight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(350 210) rotate(42) scale(500 350)">
      <stop stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="softDepth" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(690 762) rotate(150) scale(500 280)">
      <stop stop-color="#5143DA" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5143DA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="whiteMark" x1="335" y1="300" x2="650" y2="765" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1EFFF"/>
    </linearGradient>
    <filter id="baseShadow" x="-18%" y="-16%" width="136%" height="142%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="34" stdDeviation="34" flood-color="#5747DA" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#251D8E" flood-opacity="0.09"/>
    </filter>
    <filter id="markShadow" x="-18%" y="-20%" width="136%" height="148%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="13" stdDeviation="14" flood-color="#493CD2" flood-opacity="0.20"/>
      <feDropShadow dx="0" dy="-3" stdDeviation="7" flood-color="#FFFFFF" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="transparent"/>

  <g filter="url(#baseShadow)">
    <rect x="150" y="122" width="724" height="756" rx="168" fill="url(#bg)"/>
    <rect x="150" y="122" width="724" height="756" rx="168" fill="url(#softLight)"/>
    <rect x="150" y="122" width="724" height="756" rx="168" fill="url(#softDepth)"/>
  </g>

  <text
    x="512"
    y="610"
    text-anchor="middle"
    fill="url(#whiteMark)"
    filter="url(#markShadow)"
    font-family="Arial Rounded MT Bold, SF Pro Rounded, Avenir Next, Arial, sans-serif"
    font-size="328"
    font-weight="900"
    letter-spacing="-18">PM</text>

  <path d="M420 741C462 789 563 790 611 742" stroke="url(#whiteMark)" stroke-width="34" stroke-linecap="round" fill="none" opacity="0.98" filter="url(#markShadow)"/>
</svg>

name: Build Installers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Run tests
        run: npm test

  build-mac:
    name: Build macOS DMG
    runs-on: macos-14
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Build DMG
        run: npm run package:mac

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: PromptManager-macOS
          path: tools/prompt-manager-mac/dist/*.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run package:windows

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PromptManager-Windows
          path: tools/prompt-manager-windows/dist/*.exe
          if-no-files-found: error

  release:
    name: Publish latest installers
    runs-on: ubuntu-latest
    needs: [build-mac, build-windows]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: PromptManager-macOS
          path: release-assets/mac

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: PromptManager-Windows
          path: release-assets/windows

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/final
          cp release-assets/mac/*.dmg release-assets/final/PromptManager-macOS.dmg
          cp release-assets/windows/*.exe release-assets/final/PromptManager-Windows-x64.exe

      - name: Publish latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -f latest "$GITHUB_SHA"
          git push -f origin latest

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest release-assets/final/* --clobber
            gh release edit latest --latest
          else
            gh release create latest release-assets/final/* \
              --title "Prompt Manager latest" \
              --notes "Latest automatically built installers for Prompt Manager." \
              --latest
          fi
